      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="96" cy="96" r="92" fill="url(#bg)"/>

  <!-- Borde dorado -->
