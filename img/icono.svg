  <!-- Bandera de Cali -->
  <rect x="36" y="48" width="120" height="24" rx="6" fill="#ffcf00"/>
  <rect x="36" y="78" width="120" height="24" rx="6" fill="#007a4d"/>
  <rect x="36" y="108" width="120" height="24" rx="6" fill="#e3222a"/>

  <!-- texto EP -->
