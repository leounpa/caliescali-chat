<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="400" height="120" rx="16" fill="url(#bg)"/>

  <!-- Bandera de Cali (icono pequeño) -->
  <rect x="20" y="25" width="70" height="18" rx="4" fill="#ffcf00"/>
  <rect x="20" y="48" width="70" height="18" rx="4" fill="#007a4d"/>
  <rect x="20" y="71" width="70" height="18" rx="4" fill="#e3222a"/>

  <!-- Borde dorado alrededor de la bandera -->
  <rect x="18" y="23" width="74" height="68" rx="6" fill="none" stroke="#ffcf00" stroke-width="2"/>

  <!-- Texto principal -->
  <text x="115" y="52" font-family="Arial Black, Impact, sans-serif" font-size="38" font-weight="900" fill="#ffcf00" filter="url(#glow)">EL PARCHE</text>
  <text x="115" y="92" font-family="Arial Black, Impact, sans-serif" font-size="32" font-weight="900" fill="#ffffff">DE CALI</text>

  <!-- Emoji bailarina -->
  <text x="360" y="75" font-size="40">💃</text>

  <!-- Línea decorativa -->
  <line x1="115" y1="58" x2="330" y2="58" stroke="#ffcf00" stroke-width="2" opacity="0.5"/>
</svg>