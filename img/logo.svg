<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fondo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo circular -->
  <circle cx="256" cy="256" r="250" fill="url(#fondo)" filter="url(#sombra)"/>

  <!-- Borde dorado -->
  <circle cx="256" cy="256" r="245" fill="none" stroke="#ffcf00" stroke-width="4"/>

  <!-- Bandera de Cali (3 franjas horizontales) -->
  <rect x="100" y="130" width="312" height="70" rx="12" fill="#ffcf00"/>
  <rect x="100" y="210" width="312" height="70" rx="12" fill="#007a4d"/>
  <rect x="100" y="290" width="312" height="70" rx="12" fill="#e3222a"/>

  <!-- texto "EL PARCHE" -->
  <text x="256" y="105" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="42" font-weight="900" fill="#ffcf00" filter="url(#glow)" letter-spacing="3">EL PARCHE</text>

  <!-- texto "DE CALI" -->
  <text x="256" y="410" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="50" font-weight="900" fill="#ffffff" filter="url(#glow)" letter-spacing="4">DE CALI</text>

  <!-- Emoji bailarina -->
  <text x="256" y="475" text-anchor="middle" font-size="48">💃</text>

  <!-- Puntos decorativos -->
  <circle cx="120" cy="165" r="4" fill="#1a1a2e" opacity="0.3"/>
  <circle cx="392" cy="165" r="4" fill="#1a1a2e" opacity="0.3"/>
  <circle cx="120" cy="245" r="4" fill="#1a1a2e" opacity="0.3"/>
  <circle cx="392" cy="245" r="4" fill="#1a1a2e" opacity="0.3"/>
  <circle cx="120" cy="325" r="4" fill="#1a1a2e" opacity="0.3"/>
  <circle cx="392" cy="325" r="4" fill="#1a1a2e" opacity="0.3"/>
</svg>