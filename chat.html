<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>#Cali · El Parche de Cali</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<style>
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{display:flex;flex-direction:column;font-family:'Open Sans',Arial,sans-serif}

.chat-nav{flex-shrink:0}
.chat-body{flex:1;display:flex;overflow:hidden;position:relative}
.chat-mensajes{flex:1;overflow-y:auto;padding:12px 16px;background:#f4f1ea}
.chat-usuarios{width:260px;border-left:1px solid #ddd;background:#fff;overflow-y:auto;display:flex;flex-direction:column}
.chat-input-bar{flex-shrink:0;border-top:1px solid #ddd;background:#fff;padding:10px 16px}

.mensaje{margin-bottom:10px;max-width:85%}
.mensaje.sistema{text-align:center;color:#888;font-size:.85em;max-width:100%;margin:6px 0}
.mensaje.propio{margin-left:auto}
.mensaje .nick{font-weight:700;font-size:.85em;margin-right:6px}
.mensaje .avatar-mini{margin-right:4px}
.mensaje .texto{display:block;background:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 1px 3px rgba(0,0,0,.1);word-wrap:break-word}
.mensaje.propio .texto{background:#dcf8c6}
.mensaje .hora{font-size:.7em;color:#999;margin-top:2px;display:block}
.mensaje.archivo-img img{max-width:240px;border-radius:8px;cursor:pointer}
.mensaje.archivo-vid video{max-width:280px;border-radius:8px}
.mensaje.archivo-link{color:#0b7285;font-weight:600}

.badge{font-size:.65em;padding:1px 6px;border-radius:8px;color:#fff;margin-left:4px;vertical-align:middle}
.badge-nuevo{background:#3730a3}
.badge-activo{background:#065f46}
.badge-veterano{background:#92400e}
.badge-leyenda{background:#9d174d}
.badge-mod{background:#e3222a}

.usuario-item{padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid #f0f0f0}
.usuario-item:hover{background:#f5f5f5}
.usuario-item.yo{background:#e8f5e9;font-weight:700}
.usuario-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.usuario-item .nombre{flex:1;font-size:.9em}
.usuario-item .no-leidos{background:#e3222a;color:#fff;border-radius:50%;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:.7em;font-weight:700}

.priv-bar{background:#fff3cd;padding:6px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #ffc107}
.priv-bar.hidden{display:none}

.radio-bar{flex-shrink:0;background:#1a1a2e;color:#fff;padding:4px 16px;display:flex;align-items:center;gap:8px;font-size:.85em}
.radio-bar button{background:none;border:none;color:#fff;cursor:pointer;font-size:1.1em}
.radio-bar select{background:#333;color:#fff;border:1px solid #555;border-radius:4px;padding:2px 4px;font-size:.85em}

.emoji-panel{display:none;flex-wrap:wrap;gap:4px;padding:8px;background:#fff;border-top:1px solid #ddd;max-height:140px;overflow-y:auto}
.emoji-panel.abierto{display:flex}
.emoji-item{background:none;border:none;font-size:1.3em;cursor:pointer;padding:4px;border-radius:4px}
.emoji-item:hover{background:#eee}

.adjunto-bar{background:#e3f2fd;padding:4px 16px;display:flex;align-items:center;gap:8px;font-size:.85em}
.adjunto-bar.hidden{display:none}

.input-group{display:flex;gap:8px;align-items:center}
.input-group input[type=text]{flex:1}
.input-group .file-input{display:none}

@media(max-width:768px){
  .chat-usuarios{position:absolute;right:0;top:0;bottom:0;width:260px;z-index:10;box-shadow:-2px 0 8px rgba(0,0,0,.2);display:none}
  .chat-usuarios.abierto{display:flex}
}
</style>
</head>
<body>

<!-- Nav -->
<nav class="navbar is-dark" style="flex-shrink:0">
  <div class="navbar-brand">
    <a href="index.html" style="display:flex;align-items:center;gap:8px;padding:6px 12px;color:#fff;text-decoration:none">
      <img src="img/favicon.svg" width="32" height="32" alt="Logo">
      <span style="font-family:'Bebas Neue',sans-serif;font-size:1.3em;letter-spacing:1px">El Parche de Cali</span>
      <span id="sala-label" style="color:#ffcf00;font-size:.8em"></span>
    </a>
  </div>
  <div class="navbar-menu">
    <div class="navbar-end">
      <div class="navbar-item">
        <span id="chip-users" style="color:#aaa;font-size:.9em">👥 0 conectados</span>
        <button class="button is-small is-light ml-2" id="btn-toggle-users" title="Usuarios">👥</button>
        <a href="index.html" class="button is-small is-danger ml-2">Salir</a>
      </div>
    </div>
  </div>
</nav>

<!-- Radio -->
<div class="radio-bar">
  <button id="radio-play" title="Play / Pause">▶</button>
  <span>📻</span>
  <span id="radio-name">Radio El Sol</span>
  <select id="radio-select">
    <option value="0">Radio El Sol</option>
    <option value="1">Rumba Stereo</option>
    <option value="2">Olímpica Stereo</option>
    <option value="3">Boom FM</option>
    <option value="4">La X</option>
    <option value="5">Oxígeno</option>
    <option value="6">Los 40</option>
    <option value="7">Radio Policía</option>
  </select>
  <audio id="radio-audio" preload="none"></audio>
</div>

<!-- Private chat bar -->
<div class="priv-bar hidden" id="priv-bar">
  <button id="priv-back" title="Volver" class="button is-small is-warning">← Volver</button>
  <span style="font-weight:700" id="priv-title"></span>
</div>

<!-- Body -->
<div class="chat-body">
  <div class="chat-mensajes" id="mensajes">
    <div class="mensaje sistema">Conectando al Parche de Cali...</div>
  </div>
  <div class="chat-usuarios" id="panel-users">
    <div style="padding:12px;font-weight:700;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center">
      <span>En el Parche</span>
      <button class="delete is-small" id="btn-close-users"></button>
    </div>
    <div id="list-users" style="flex:1;overflow-y:auto"></div>
  </div>
</div>

<!-- Adjunto preview -->
<div class="adjunto-bar hidden" id="adjunto-bar">
  <span id="adjunto-name"></span>
  <button class="delete is-small" id="adjunto-remove"></button>
</div>

<!-- Emoji panel -->
<div class="emoji-panel" id="emoji-panel"></div>

<!-- Input -->
<div class="chat-input-bar">
  <form id="msg-form" class="input-group">
    <button type="button" id="btn-camera" title="Tomar foto" class="button is-small is-info">📷</button>
    <div class="file-input">
      <input type="file" id="file-input" accept="image/*,video/*">
    </div>
    <label for="file-input" class="button is-small is-link" title="Adjuntar archivo" style="cursor:pointer">📎</label>
    <button type="button" id="btn-emoji" title="Emojis" class="button is-small">😊</button>
    <input type="text" id="msg-input" maxlength="500" placeholder="Escribe tu mensaje, parce..." autocomplete="off" disabled class="input">
    <button type="submit" id="btn-send" disabled class="button is-success">Enviar</button>
  </form>
</div>

<script src="js/chat.js"></script>
</body>
</html>
