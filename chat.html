<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#Cali · El Parche de Cali</title>
<meta name="description" content="Sala de chat de El Parche de Cali. Chatea en vivo con los caleños.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='33' fill='%23ffcf00'/><rect y='33' width='100' height='34' fill='%23007a4d'/><rect y='67' width='100' height='33' fill='%23e3222a'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body class="sala">
<div class="sala-cabecera">
  <div class="contenedor">
    <a href="index.html" class="marca">
      <span class="marca-ico">💃</span>
      <span class="marca-txt">
        <strong>El Parche de Cali</strong>
        <small id="sala-titulo">#Cali</small>
      </span>
    </a>
    <div class="sala-info">
      <span class="chip" id="chip-conectados">👥 0 conectados</span>
      <a href="index.html" class="btn-salir" title="Salir">Salir</a>
    </div>
  </div>
</div>

<div class="contenedor sala-cuerpo">
  <section class="panel-mensajes" id="mensajes">
    <div class="mensaje sistema">Conectando al Parche de Cali...</div>
  </section>

  <aside class="panel-usuarios">
    <h3>En el Parche</h3>
    <ul id="lista-usuarios"></ul>
  </aside>
</div>

<div class="sala-pie">
  <form id="form-mensaje" class="contenedor form-mensaje">
    <input type="text" id="mensaje-input" maxlength="500" placeholder="Escribe tu mensaje, parce..." autocomplete="off" disabled>
    <button type="submit" id="btn-enviar" disabled>Enviar</button>
  </form>
</div>

<script src="js/chat.js"></script>
</body>
</html>
