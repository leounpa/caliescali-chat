<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>#Cali · El Parche de Cali</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<style>
html,body{height:100%;margin:0;padding:0;overflow:hidden;touch-action:manipulation}
body{display:flex;flex-direction:column;font-family:'Open Sans',Arial,sans-serif;-webkit-tap-highlight-color:transparent}

.chat-nav{flex-shrink:0}
.chat-body{flex:1;display:flex;overflow:hidden;position:relative;min-height:0}
.chat-mensajes{flex:1;overflow-y:auto;padding:12px 16px;background:#f4f1ea;-webkit-overflow-scrolling:touch}
.chat-usuarios{width:260px;border-left:1px solid #ddd;background:#fff;overflow-y:auto;display:flex;flex-direction:column;flex-shrink:0}
.chat-input-bar{flex-shrink:0;border-top:1px solid #ddd;background:#fff;padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}

.mensaje{margin-bottom:10px;max-width:85%}
.mensaje.sistema{text-align:center;color:#888;font-size:.85em;max-width:100%;margin:6px 0}
.mensaje.propio{margin-left:auto}
.mensaje .nick{font-weight:700;font-size:.85em;margin-right:6px}
.mensaje .avatar-mini{margin-right:4px}
.mensaje .texto{display:block;background:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 1px 3px rgba(0,0,0,.1);word-wrap:break-word}
.mensaje.propio .texto{background:#dcf8c6}
.mensaje .hora{font-size:.7em;color:#999;margin-top:2px;display:block}
.mensaje.archivo-img img{max-width:240px;border-radius:8px;cursor:pointer}
.mensaje.archivo-vid video{max-width:280px;border-radius:8px}
.mensaje.archivo-link{color:#0b7285;font-weight:600}
.media-placeholder{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#f0f0f0;border-radius:8px;cursor:pointer;font-size:.9em;color:#555;transition:background .15s}
.media-placeholder:hover{background:#e0e0e0}
.media-placeholder i{font-size:1.4em}

.badge{font-size:.65em;padding:1px 6px;border-radius:8px;color:#fff;margin-left:4px;vertical-align:middle}
.badge-nuevo{background:#3730a3}
.badge-activo{background:#065f46}
.badge-veterano{background:#92400e}
.badge-leyenda{background:#9d174d}
.badge-mod{background:#e3222a}

.usuario-item{padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid #f0f0f0}
.usuario-item:hover{background:#f5f5f5}
.usuario-item.yo{background:#e8f5e9;font-weight:700}
.usuario-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.usuario-item .nombre{flex:1;font-size:.9em}
.usuario-item .no-leidos{background:#e3222a;color:#fff;border-radius:50%;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:.7em;font-weight:700}

.priv-bar{background:#fff3cd;padding:6px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #ffc107}
.priv-bar.hidden{display:none}

.radio-bar{flex-shrink:0;background:#1a1a2e;color:#fff;padding:4px 16px;display:flex;align-items:center;gap:8px;font-size:.85em}
.radio-bar button{background:none;border:none;color:#fff;cursor:pointer;font-size:1.1em}
.radio-bar select{background:#333;color:#fff;border:1px solid #555;border-radius:4px;padding:2px 4px;font-size:.85em}

.emoji-panel{display:none;flex-wrap:wrap;gap:4px;padding:8px;background:#fff;border-top:1px solid #ddd;max-height:140px;overflow-y:auto}
.emoji-panel.abierto{display:flex}
.emoji-item{background:none;border:none;font-size:1.3em;cursor:pointer;padding:4px;border-radius:4px}
.emoji-item:hover{background:#eee}

.adjunto-bar{background:#e3f2fd;padding:4px 16px;display:flex;align-items:center;gap:8px;font-size:.85em}
.adjunto-bar.hidden{display:none}

.cali-flag{display:block;width:100%;height:1cm;min-height:1cm;max-height:1cm;background:url('img/bandera-cali.svg') center/cover no-repeat;flex-shrink:0;position:relative;z-index:20}
.cali-nav{display:flex;align-items:center;background:#1a1a2e;flex-shrink:0;padding:0 12px;gap:8px;height:36px}
.cali-nav-left{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.cali-nav-center{display:flex;align-items:center;gap:6px;flex:1;justify-content:center}
.cali-nav-right{display:flex;align-items:center;gap:6px;flex:1;justify-content:flex-end}
.cali-title{font-family:'Bebas Neue',sans-serif;font-size:1em;color:#fff;letter-spacing:1.5px;white-space:nowrap}
.cali-sala{color:#ffcf00;font-size:.75em;font-weight:600}
.cali-users{color:#aaa;font-size:.8em}
.cali-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:3px 10px;border-radius:4px;font-size:.75em;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s;position:relative}
.cali-btn:hover{background:rgba(255,255,255,.25)}
.cali-btn.active{background:#ffcf00;color:#1a1a2e;border-color:#ffcf00}

.sala-switcher{display:flex;gap:4px;flex-wrap:wrap;padding:4px 12px;background:#16213e;flex-shrink:0;overflow-x:auto}
.sala-switcher button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#ccc;padding:3px 10px;border-radius:12px;font-size:.78em;cursor:pointer;white-space:nowrap;transition:all .15s}
.sala-switcher button:hover{background:rgba(255,255,255,.18);color:#fff}
.sala-switcher button.sala-active{background:#3730a3;color:#fff;border-color:#3730a3}

.flag-popup{position:fixed;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.3);padding:12px 16px;z-index:80;text-align:center;pointer-events:none;display:none}
.flag-popup .flag-big{font-size:2.5em}
.flag-popup .flag-country{font-size:.85em;color:#555;margin-top:4px}
.cali-btn-salir{background:rgba(227,34,42,.6);border-color:rgba(227,34,42,.8)}
.cali-btn-salir:hover{background:rgba(227,34,42,.85)}
.cali-priv-badge{position:absolute;top:-6px;right:-6px;background:#e3222a;color:#fff;border-radius:50%;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:.65em;font-weight:700;display:none}
.cali-priv-badge.visible{display:flex}

.settings-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.settings-modal.hidden{display:none}
.settings-box{background:#fff;border-radius:12px;width:100%;max-width:380px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.settings-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee;font-weight:700;font-size:1em}
.settings-header .close-settings{background:none;border:none;font-size:1.3em;cursor:pointer;color:#888;padding:4px}
.settings-header .close-settings:hover{color:#333}
.settings-body{padding:16px}
.settings-section{margin-bottom:16px}
.settings-section:last-child{margin-bottom:0}
.settings-label{font-size:.85em;font-weight:600;color:#555;margin-bottom:6px;display:block}
.settings-avatar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.settings-avatar-option{width:100%;aspect-ratio:1;border:2px solid transparent;border-radius:8px;background:#f5f5f5;font-size:1.4em;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s}
.settings-avatar-option:hover{border-color:#aaa}
.settings-avatar-option.selected{border-color:#3730a3;background:#e8eaf6}
.settings-nick-input{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:.9em}
.settings-nick-input:focus{outline:none;border-color:#3730a3}
.settings-btn{width:100%;padding:8px;border:none;border-radius:6px;font-size:.9em;font-weight:600;cursor:pointer;transition:background .15s}
.settings-btn-primary{background:#3730a3;color:#fff}
.settings-btn-primary:hover{background:#2d27a0}
.settings-theme-row{display:flex;align-items:center;justify-content:space-between}
.settings-toggle{width:42px;height:24px;border-radius:12px;background:#ccc;border:none;cursor:pointer;position:relative;transition:background .2s}
.settings-toggle.on{background:#3730a3}
.settings-toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.settings-toggle.on::after{left:20px}

.input-group{display:flex;gap:8px;align-items:center}
.input-group input[type=text]{flex:1}
.input-group .file-input{display:none}

.priv-chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 16px;background:#fff;border-bottom:1px solid #eee;flex-shrink:0}
.priv-chips:empty{display:none}
.priv-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:14px;font-size:.82em;cursor:pointer;border:1px solid #ddd;background:#fff;transition:background .15s}
.priv-chip:hover{background:#f0f0f0}
.priv-chip.activo{background:#3730a3;color:#fff;border-color:#3730a3}
.priv-chip .unread{background:#e3222a;color:#fff;border-radius:50%;min-width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:.7em;font-weight:700}
.priv-chip .close-priv{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.15);color:inherit;font-size:.7em;cursor:pointer;margin-left:2px;line-height:1}
.priv-chip .close-priv:hover{background:rgba(227,34,42,.6);color:#fff}

.cam-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.cam-modal.hidden{display:none}
.cam-modal video{max-width:90vw;max-height:50vh;border-radius:8px;background:#000}
.cam-modal canvas{display:none}
.cam-controls{display:flex;gap:10px;align-items:center}
.cam-controls button{padding:8px 16px;border:none;border-radius:8px;font-size:.95em;cursor:pointer;font-weight:600}
.cam-controls .btn-capture{background:#e3222a;color:#fff;width:56px;height:56px;border-radius:50%;font-size:1.3em;display:flex;align-items:center;justify-content:center}
.cam-controls .btn-capture.recording{animation:pulse 1s infinite}
.cam-controls .btn-mode{background:#333;color:#fff}
.cam-controls .btn-mode.activo{background:#3730a3}
.cam-controls .btn-flip{background:#555;color:#fff}
.cam-controls .btn-cancel{background:#888;color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

@media(max-width:768px){
  html,body{height:100%;height:100dvh;overflow:hidden}
  body{display:flex;flex-direction:column}

  .cali-flag{height:.6cm;min-height:.6cm;max-height:.6cm}
  .cali-nav{padding:0 8px;height:32px;gap:4px}
  .cali-nav-left img{width:20px;height:20px}
  .cali-title{font-size:.8em}
  .cali-sala{display:none}
  .cali-nav-center{display:none}
  .cali-nav-right{gap:4px}
  .cali-btn{padding:3px 6px;font-size:.7em}

  .settings-modal{padding:8px}
  .settings-box{max-height:90vh}
  .settings-avatar-grid{grid-template-columns:repeat(6,1fr)}

  .radio-bar{padding:3px 8px;font-size:.75em;gap:4px}
  .radio-bar select{font-size:.75em;max-width:120px}

  .sala-switcher{padding:3px 8px;gap:3px}
  .sala-switcher button{font-size:.72em;padding:2px 8px}

  .chat-body{flex:1;min-height:0;overflow:hidden}
  .chat-mensajes{padding:8px 10px}

  .chat-usuarios{position:fixed;right:0;top:auto;bottom:0;left:0;width:100%;max-height:60vh;z-index:50;box-shadow:0 -4px 16px rgba(0,0,0,.3);display:none;background:#fff;border-radius:16px 16px 0 0}
  .chat-usuarios.abierto{display:flex}

  .adjunto-bar{padding:3px 10px;font-size:.8em}

  .emoji-panel{max-height:100px;padding:6px}

  .chat-input-bar{padding:6px 8px}
  .input-group{flex-wrap:wrap;gap:4px}
  .input-group input[type=text]{flex:1 1 auto;min-width:0;order:10;font-size:16px;padding:6px 10px}
  #btn-send{order:11;flex:1 1 auto;font-size:.85em;padding:6px 8px}
  #btn-camera{order:1;font-size:1.1em;padding:6px 8px;min-width:36px;min-height:36px}
  #file-input + label{order:2;font-size:1.1em;padding:6px 8px;min-width:36px;min-height:36px}
  #btn-emoji{order:3;font-size:1.1em;padding:6px 8px;min-width:36px;min-height:36px}

  .mensaje{max-width:90%}
  .mensaje .texto{font-size:.9em;padding:6px 10px}
  .media-placeholder{padding:8px 10px;font-size:.85em}

  .cam-modal{padding:10px}
  .cam-modal video{max-width:95vw;max-height:40vh}
  .cam-controls{flex-wrap:wrap;justify-content:center;gap:6px}
  .cam-controls button{padding:6px 12px;font-size:.85em}
  .cam-controls .btn-capture{width:48px;height:48px}

  .priv-bar{padding:4px 10px}
  .priv-chips{padding:3px 10px}
}
</style>
</head>
<body>

<!-- Bandera de Cali -->
<div class="cali-flag"></div>

<!-- Barra de navegación -->
<div class="cali-nav">
  <div class="cali-nav-left">
    <img src="img/favicon.svg" width="28" height="28" alt="Logo">
    <span class="cali-title">El Parche de Cali</span>
    <span id="sala-label" class="cali-sala"></span>
    <button id="btn-settings" class="cali-btn" title="Configuración" style="padding:2px 6px;font-size:.85em">⚙️</button>
  </div>
  <div class="cali-nav-center">
    <span id="chip-users" class="cali-users">👥 0 conectados</span>
  </div>
  <div class="cali-nav-right">
    <button id="btn-priv-notif" class="cali-btn" title="Mensajes privados" style="display:none">🔒 <span id="priv-total-badge" class="cali-priv-badge">0</span></button>
    <button id="btn-toggle-users" class="cali-btn" title="Usuarios">👥</button>
    <a href="index.html" class="cali-btn cali-btn-salir">Salir</a>
  </div>
</div>

<!-- Radio -->
<div class="radio-bar">
  <button id="radio-play" title="Play / Pause">▶</button>
  <span>📻</span>
  <span id="radio-name">Radio El Sol</span>
  <select id="radio-select">
    <option value="0">Radio El Sol</option>
    <option value="1">Rumba Stereo</option>
    <option value="2">Olímpica Stereo</option>
    <option value="3">Boom FM</option>
    <option value="4">La X</option>
    <option value="5">Oxígeno</option>
    <option value="6">Los 40</option>
    <option value="7">Radio Policía</option>
  </select>
  <audio id="radio-audio" preload="none"></audio>
</div>

<!-- Sala switcher -->
<div class="sala-switcher" id="sala-switcher"></div>

<!-- Private chat bar -->
<div class="priv-bar hidden" id="priv-bar">
  <button id="priv-back" title="Volver" class="button is-small is-warning">← Volver</button>
  <span style="font-weight:700" id="priv-title"></span>
</div>

<!-- Private chats chips -->
<div class="priv-chips" id="priv-chips"></div>

<!-- Body -->
<div class="chat-body">
  <div class="chat-mensajes" id="mensajes">
    <div class="mensaje sistema">Conectando al Parche de Cali...</div>
  </div>
  <div class="chat-usuarios" id="panel-users">
    <div style="padding:12px;font-weight:700;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center">
      <span>En el Parche</span>
      <button class="delete is-small" id="btn-close-users"></button>
    </div>
    <div id="list-users" style="flex:1;overflow-y:auto"></div>
  </div>
</div>

<!-- Adjunto preview -->
<div class="adjunto-bar hidden" id="adjunto-bar">
  <span id="adjunto-name"></span>
  <button class="delete is-small" id="adjunto-remove"></button>
</div>

<!-- Emoji panel -->
<div class="emoji-panel" id="emoji-panel"></div>

<!-- Input -->
<div class="chat-input-bar">
  <form id="msg-form" class="input-group">
    <button type="button" id="btn-camera" title="Tomar foto" class="button is-small is-info">📷</button>
    <div class="file-input">
      <input type="file" id="file-input" accept="image/*,video/*">
    </div>
    <label for="file-input" class="button is-small is-link" title="Adjuntar archivo" style="cursor:pointer">📎</label>
    <button type="button" id="btn-emoji" title="Emojis" class="button is-small">😊</button>
    <input type="text" id="msg-input" maxlength="500" placeholder="Escribe tu mensaje, parce..." autocomplete="off" disabled class="input">
    <button type="submit" id="btn-send" disabled class="button is-success">Enviar</button>
  </form>
</div>

<!-- Camera modal -->
<div class="cam-modal hidden" id="cam-modal">
  <video id="cam-video" autoplay playsinline muted></video>
  <canvas id="cam-canvas" width="640" height="480"></canvas>
  <div class="cam-controls">
    <button type="button" class="btn-cancel" id="cam-cancel">✕ Cancelar</button>
    <button type="button" class="btn-mode" id="cam-mode-photo" title="Foto">📷 Foto</button>
    <button type="button" class="btn-capture" id="cam-capture" title="Capturar">●</button>
    <button type="button" class="btn-mode" id="cam-mode-video" title="Video">🎬 Video</button>
    <button type="button" class="btn-flip" id="cam-flip" title="Voltear cámara">🔄</button>
  </div>
</div>

<!-- Settings Modal -->
<div class="settings-modal hidden" id="settings-modal">
  <div class="settings-box">
    <div class="settings-header">
      <span>⚙️ Configuración</span>
      <button class="close-settings" id="close-settings">✕</button>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <span class="settings-label">Tu avatar</span>
        <div class="settings-avatar-grid" id="avatar-grid"></div>
      </div>
      <div class="settings-section">
        <span class="settings-label">Tu nombre (apodo)</span>
        <input type="text" class="settings-nick-input" id="settings-nick" maxlength="24" placeholder="Escribe tu apodo">
      </div>
      <div class="settings-section">
        <div class="settings-theme-row">
          <span class="settings-label" style="margin-bottom:0">Modo oscuro</span>
          <button class="settings-toggle" id="toggle-dark"></button>
        </div>
      </div>
      <div class="settings-section">
        <button class="settings-btn settings-btn-primary" id="save-settings">Guardar cambios</button>
      </div>
    </div>
  </div>
</div>

<!-- Flag popup -->
<div class="flag-popup" id="flag-popup">
  <div class="flag-big" id="flag-big"></div>
  <div class="flag-country" id="flag-country"></div>
</div>

<script src="js/chat.js"></script>
</body>
</html>
