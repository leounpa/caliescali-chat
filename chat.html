<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>#Cali · El Parche de Cali</title>
<meta name="description" content="Sala de chat de El Parche de Cali. Chatea en vivo con los caleños.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='33' fill='%23ffcf00'/><rect y='33' width='100' height='34' fill='%23007a4d'/><rect y='67' width='100' height='33' fill='%23e3222a'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body class="sala">
<div class="sala-cabecera">
  <div class="contenedor">
    <a href="index.html" class="marca">
      <span class="marca-ico">💃</span>
      <span class="marca-txt">
        <strong>El Parche de Cali</strong>
        <small id="sala-titulo">#Cali</small>
      </span>
    </a>
  <div class="sala-info">
      <span class="chip" id="chip-conectados">👥 0 conectados</span>
      <button type="button" class="btn-usuarios" id="btn-usuarios" title="Usuarios">👥</button>
      <a href="index.html" class="btn-salir" title="Salir">Salir</a>
    </div>
  </div>
</div>

<!-- Barra de radio -->
<div class="radio-barra">
  <button type="button" class="radio-play" id="radio-play" title="Reproducir / pausar">▶</button>
  <span class="radio-ico" id="radio-ico">📻</span>
  <span class="radio-nombre" id="radio-nombre">Radio El Sol</span>
  <select class="radio-emisoras" id="radio-emisoras" title="Cambiar emisora">
    <option value="0" selected>Radio El Sol</option>
    <option value="1">Rumba Stereo</option>
    <option value="2">Olímpica Stereo</option>
    <option value="3">Boom FM</option>
    <option value="4">La X</option>
    <option value="5">Oxígeno</option>
    <option value="6">Los 40</option>
    <option value="7">Radio Policía</option>
  </select>
  <audio id="radio-audio" preload="none"></audio>
</div>

<!-- Barra del chat privado -->
<div class="privado-barra oculto" id="privado-barra">
  <button type="button" class="privado-volver" id="privado-volver" title="Volver a la sala">←</button>
  <span class="privado-titulo" id="privado-titulo"></span>
  <button type="button" class="privado-videollamada" id="btn-videollamada" title="Videollamada">📹</button>
  <span class="privado-bloqueo" id="privado-bloqueo" title="Chat privado">🔒</span>
</div>

<div class="videollamada-panel oculto" id="videollamada-panel">
  <div class="videollamada-cab">
    <span>📹 Videollamada con <b id="videollamada-con"></b></span>
    <button type="button" class="videollamada-cerrar" id="videollamada-cerrar" title="Cerrar">✕</button>
  </div>
  <div class="videollamada-marco" id="videollamada-marco"></div>
</div>

<div class="videos-panel oculto" id="videos-panel">
  <div class="videos-cab">
    <span>🎥 En vivo</span>
    <button type="button" class="videos-cerrar" id="videos-cerrar" title="Ocultar videos">✕</button>
  </div>
  <div class="videos-grid" id="videos-grid"></div>
</div>

<div class="contenedor sala-cuerpo">
  <section class="panel-mensajes" id="mensajes">
    <div class="mensaje sistema">Conectando al Parche de Cali...</div>
  </section>

  <aside class="panel-usuarios" id="panel-usuarios">
    <div class="panel-usuarios-cab">
      <h3>En el Parche</h3>
      <button type="button" class="btn-cerrar-usuarios" id="btn-cerrar-usuarios" title="Cerrar">✕</button>
    </div>
    <ul id="lista-usuarios"></ul>
  </aside>
</div>

<div class="sala-pie">
  <form id="form-mensaje" class="contenedor form-mensaje">
    <div class="cam-controls">
      <label class="btn-cam" id="btn-cam" title="Activar cámara en vivo">🎥</label>
      <label class="btn-cam btn-cam-foto oculto" id="btn-foto" title="Tomar foto en vivo">📸</label>
      <div class="adjuntar-wrap">
        <label class="btn-adjuntar" id="btn-adjuntar" title="Enviar foto o video (galería)" for="archivo-input">📷</label>
        <input type="file" id="archivo-input" accept="image/*,video/*" hidden>
      </div>
      <button type="button" class="btn-emoji" id="btn-emoji" title="Emojis">😊</button>
    </div>
    <input type="text" id="mensaje-input" maxlength="500" placeholder="Escribe tu mensaje, parce..." autocomplete="off" disabled>
    <button type="submit" id="btn-enviar" disabled>Enviar</button>
  </form>
  <div class="emoji-panel oculto" id="emoji-panel"></div>
  <div class="adjunto-vista oculto" id="adjunto-vista">
    <span class="adjunto-nombre" id="adjunto-nombre"></span>
    <button type="button" class="adjunto-quitar" id="adjunto-quitar" title="Quitar">✕</button>
  </div>
</div>

<script src="js/chat.js"></script>
</body>
</html>
